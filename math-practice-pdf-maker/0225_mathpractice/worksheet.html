<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5학년 1학기 수학 연습지 만들기</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

    :root {
      --paper-width: 210mm;
      --paper-height: 297mm;
      --control-width: 1180px;
      --line-color: #4a4a4a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(180deg, #eef2f7 0%, #dde5ee 100%);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #2f3640;
    }

    .controls {
      width: min(100%, var(--control-width));
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      padding: 18px 20px;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(31, 41, 55, 0.12);
      margin-bottom: 22px;
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      position: sticky;
      top: 18px;
      z-index: 100;
    }

    .control-stack {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      flex: 1 1 620px;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
    }

    select,
    input[type="number"] {
      padding: 9px 12px;
      border: 2px solid #d8dee9;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      background: white;
    }

    #unitSelect { min-width: 250px; }
    #worksheetSelect { min-width: 420px; }

    input[type="number"] {
      width: 58px;
      text-align: center;
      font-size: 15px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    button:hover { opacity: 0.88; }
    button:active { transform: scale(0.98); }

    .btn-refresh { background: #23b26d; color: white; }
    .btn-add { background: #ef8f1d; color: white; }
    .btn-answer { background: #6f58c9; color: white; }
    .btn-print { background: #2d8ae2; color: white; }

    .meta-note {
      width: 100%;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      color: #57606f;
      font-size: 13px;
    }

    .meta-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      background: #f4f7fb;
      border: 1px solid #dce4ef;
    }

    .sheet {
      width: var(--paper-width);
      height: var(--paper-height);
      background: white;
      padding: 17mm 19mm 18mm;
      box-shadow: 0 0 18px rgba(28, 37, 54, 0.13);
      display: flex;
      flex-direction: column;
      margin-bottom: 30px;
      page-break-after: always;
      overflow: hidden;
    }

    .sheet:last-child { margin-bottom: 0; }

    .sheet-title {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 14px;
      padding-bottom: 9px;
      border-bottom: 2px solid #2f3640;
    }

    .sheet-title-main {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sheet-title-sub {
      font-size: 11px;
      color: #677188;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .problem-grid {
      display: grid;
      flex-grow: 1;
      gap: 12px 8px;
      align-content: stretch;
    }

    .problem-grid.standard { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(5, 1fr); }
    .problem-grid.practice { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(5, 1fr); }
    .problem-grid.dense { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(9, 1fr); gap: 6px 5px; }
    .problem-grid.divgrid { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); }
    .problem-grid.concept { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(5, 1fr); gap: 14px 14px; }
    .problem-grid.wide { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(4, 1fr); gap: 16px 16px; }

    .problem-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 8px;
      position: relative;
    }

    .problem-grid[data-layout-mode="spacious"] {
      align-content: center;
    }

    .problem-grid[data-layout-mode="spacious"] .problem-item {
      justify-content: center;
      padding-top: 16px;
    }

    .problem-num {
      position: absolute;
      top: 0;
      left: 0;
      width: 19px;
      height: 19px;
      border: 1.5px solid #5a6578;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 500;
      color: #5a6578;
      background: white;
    }

    .calc-wrapper { display: flex; align-items: center; margin-top: 12px; }

    .calc-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      font-size: calc(22px * var(--font-scale, 1));
      letter-spacing: 2px;
      min-width: calc(90px * var(--font-scale, 1));
      padding: 4px 10px;
      position: relative;
      background: white;
    }

    .row { width: 100%; text-align: right; line-height: 1.35; }

    .operator-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      border-bottom: 2px solid #2f3640;
      margin-bottom: 6px;
    }

    .calc-ans {
      height: calc(28px * var(--font-scale, 1));
      text-align: right;
      width: 100%;
      font-weight: 700;
      visibility: hidden;
    }

    .answers-shown .calc-ans { visibility: visible; color: #e74c3c; }

    .ldiv-table {
      margin-top: 22px;
      border-collapse: collapse;
      font-size: calc(22px * var(--font-scale, 1));
    }

    .ldiv-q-box {
      display: inline-block;
      min-width: 56px;
      text-align: right;
      border-bottom: 2px solid #555;
      padding: 2px 6px;
    }

    .ldiv-dvsr-td {
      text-align: right;
      padding-right: 4px;
      padding-top: 4px;
      vertical-align: middle;
    }

    .ldiv-dvnd-td {
      border-top: 2px solid #2f3640;
      border-left: 2px solid #2f3640;
      padding: 4px 12px 4px 6px;
    }

    .horiz-box,
    .frac-row,
    .concept-layout,
    .relation-layout,
    .shape-layout {
      width: 100%;
      text-align: center;
      margin-top: 14px;
    }

    .horiz-box,
    .frac-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: calc(5px * var(--font-scale, 1));
      padding: 0 3px;
    }

    .horiz-box {
      font-size: calc(20px * var(--font-scale, 1));
      line-height: 1.35;
    }

    .frac-row {
      gap: calc(8px * var(--font-scale, 1));
    }

    .dense .horiz-box { margin-top: 8px; font-size: calc(16px * var(--font-scale, 1)); gap: 4px; }

    .concept-layout,
    .relation-layout,
    .shape-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .concept-card,
    .relation-card,
    .shape-card {
      width: 100%;
      border: 1.5px solid #d7dee8;
      border-radius: 12px;
      background: linear-gradient(180deg, #ffffff 0%, #fbfcfe 100%);
      padding: 10px 10px 12px;
    }

    .concept-question,
    .relation-question,
    .shape-question {
      font-size: calc(16px * var(--font-scale, 1));
      line-height: 1.45;
      word-break: keep-all;
    }

    .concept-answer,
    .shape-answer {
      margin-top: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-size: calc(16px * var(--font-scale, 1));
    }

    .small-note {
      font-size: 12px;
      color: #6c7890;
      line-height: 1.35;
    }

    .lcd-process-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(6px * var(--font-scale, 1));
      margin-top: 6px;
      font-size: calc(14px * var(--font-scale, 1));
      flex-wrap: wrap;
    }

    .lcd-label {
      background: #e8f0fe;
      color: #1a73e8;
      padding: 1px 8px;
      border-radius: 8px;
      font-size: calc(12px * var(--font-scale, 1));
      font-weight: 500;
      white-space: nowrap;
    }

    .frac-two-col {
      display: flex !important;
      flex-direction: row !important;
      align-items: center;
      gap: 10px;
    }

    .frac-col-left {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .frac-col-right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-left: 1.5px dashed #d7dee8;
      padding-left: 10px;
    }

    .frac-step-flow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      flex-wrap: wrap;
      font-size: calc(15px * var(--font-scale, 1));
      line-height: 1.6;
    }

    .frac-multi-line {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .frac-multi-line .concept-answer {
      margin-top: 0;
    }

    .frac-d {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
      font-size: calc(18px * var(--font-scale, 1));
      min-width: 30px;
    }

    .frac-d .ft {
      padding: 1px 8px;
      border-bottom: 1.5px solid #2f3640;
      min-width: 20px;
      text-align: center;
    }

    .frac-d .fb {
      padding: 1px 8px;
      min-width: 20px;
      text-align: center;
    }

    .mixed-d {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      vertical-align: middle;
    }

    .mixed-d .whole {
      font-size: calc(18px * var(--font-scale, 1));
      font-weight: 500;
    }

    .op-txt,
    .eq-txt { font-size: calc(18px * var(--font-scale, 1)); }

    .num-blank,
    .text-blank,
    .table-blank {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: calc(32px * var(--font-scale, 1));
      padding: 0 calc(8px * var(--font-scale, 1));
      border: 1.5px solid #666;
      border-radius: 6px;
      background: white;
      vertical-align: middle;
      font-size: calc(16px * var(--font-scale, 1));
      font-weight: 500;
    }

    .num-blank { min-width: calc(40px * var(--font-scale, 1)); }
    .text-blank { min-width: calc(62px * var(--font-scale, 1)); }
    .table-blank { min-width: calc(34px * var(--font-scale, 1)); padding: calc(2px * var(--font-scale, 1)) calc(8px * var(--font-scale, 1)); }

    .sym-blank {
      width: calc(28px * var(--font-scale, 1));
      height: calc(28px * var(--font-scale, 1));
      border: 1.5px solid #666;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: calc(16px * var(--font-scale, 1));
      background: white;
    }

    .frac-blank {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      vertical-align: middle;
    }

    .frac-blank .fb-top,
    .frac-blank .fb-bot {
      min-width: calc(32px * var(--font-scale, 1));
      height: calc(24px * var(--font-scale, 1));
      padding: 0 calc(8px * var(--font-scale, 1));
      border: 1.5px solid #666;
      border-radius: 4px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(15px * var(--font-scale, 1));
      line-height: 1;
    }

    .frac-blank .fb-line {
      width: calc(38px * var(--font-scale, 1));
      height: 2px;
      background: #444;
      margin: calc(2px * var(--font-scale, 1)) 0;
    }

    .div-method {
      display: inline-block;
      text-align: left;
      font-size: calc(16px * var(--font-scale, 1));
    }

    .div-method-title {
      font-size: calc(15px * var(--font-scale, 1));
      font-weight: 600;
      margin-bottom: 6px;
      text-align: center;
    }

    .div-method-row {
      display: flex;
      align-items: center;
      position: relative;
    }

    .div-method-divisor {
      min-width: calc(28px * var(--font-scale, 1));
      text-align: right;
      padding-right: 2px;
      font-weight: 500;
      color: #2d8a4e;
    }

    .div-method-paren {
      font-size: calc(18px * var(--font-scale, 1));
      margin-right: 2px;
    }

    .div-method-values {
      display: flex;
      gap: calc(16px * var(--font-scale, 1));
      padding: 3px calc(10px * var(--font-scale, 1));
      border-bottom: 2px solid #333;
      min-width: calc(100px * var(--font-scale, 1));
      justify-content: center;
      font-weight: 600;
    }

    .div-method-row:last-child .div-method-values {
      border-bottom: none;
      background: #fef9e7;
      border-radius: 4px;
      padding: 4px calc(10px * var(--font-scale, 1));
    }

    .div-method-result {
      margin-top: 8px;
      font-size: calc(14px * var(--font-scale, 1));
      text-align: center;
    }

    .div-method-result-label {
      display: inline-block;
      background: #d5f5e3;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: calc(13px * var(--font-scale, 1));
      color: #1e7e34;
    }

    .div-method-note {
      margin-top: 4px;
      font-size: calc(12px * var(--font-scale, 1));
      text-align: center;
      color: #6c7890;
    }

    .div-method-coprime {
      display: inline-block;
      background: #fdebd0;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: calc(12px * var(--font-scale, 1));
      color: #856404;
      margin-top: 2px;
    }

    .relation-table {
      margin: 4px auto 0;
      border-collapse: collapse;
      font-size: 14px;
    }

    .relation-table th,
    .relation-table td {
      border: 1.5px solid #6b7788;
      padding: 6px 8px;
      min-width: 48px;
      text-align: center;
    }

    .relation-table th {
      background: #f6f8fb;
      font-weight: 700;
    }

    .shape-svg {
      width: 150px;
      height: 96px;
      overflow: visible;
    }

    .shape-svg text {
      font-family: 'Noto Sans KR', sans-serif;
      fill: #2f3640;
      font-size: 11px;
      font-weight: 500;
    }

    .shape-svg .outline {
      fill: #f6fbff;
      stroke: #2f3640;
      stroke-width: 2;
    }

    .shape-svg .guide {
      stroke: #6b7788;
      stroke-width: 1.5;
      stroke-dasharray: 4 3;
      fill: none;
    }

    .shape-svg .grid-line {
      stroke: #c9d4e2;
      stroke-width: 1;
    }

    .shape-svg .grid-fill {
      fill: #e8f3ff;
      stroke: #94b9df;
      stroke-width: 1;
    }

    .unit-tail { margin-left: 4px; }

    [data-ans] { color: transparent; }
    .answers-shown [data-ans] { color: #e74c3c; }

    .pdf-grid-table {
      border-collapse: collapse;
      margin-top: 6px;
      font-size: calc(17px * var(--pdf-scale, 1));
      font-weight: 500;
    }

    .pdf-grid-table td {
      width: calc(26px * var(--pdf-scale, 1));
      height: calc(26px * var(--pdf-scale, 1));
      text-align: center;
      vertical-align: middle;
      border: 1.5px solid #555;
      padding: 0;
    }

    .pdf-grid-table .pdf-op-cell { font-weight: 700; }
    .pdf-grid-table .pdf-sep-bottom { border-bottom: 3px solid #2f3640; }
    .pdf-grid-table .ans-digit { color: transparent; }
    .answers-shown .pdf-grid-table .ans-digit { color: #e74c3c; }

    .pdf-div-table {
      border-collapse: collapse;
      margin-top: 6px;
      font-size: calc(17px * var(--pdf-scale, 1));
      font-weight: 500;
    }

    .pdf-div-table td {
      width: calc(26px * var(--pdf-scale, 1));
      height: calc(26px * var(--pdf-scale, 1));
      text-align: center;
      vertical-align: middle;
      padding: 0;
    }

    .pdf-div-table .pdf-b { border: 1.5px solid #555; }
    .pdf-div-table .pdf-quot-border { border-bottom: 2.5px solid #2f3640; }
    .pdf-div-table .pdf-dvsr-border { border-right: 2.5px solid #2f3640; }
    .pdf-div-table .ans-digit { color: transparent; }
    .answers-shown .pdf-div-table .ans-digit { color: #e74c3c; }

    @media print {
      @page { size: A4; margin: 0; }

      body {
        display: block;
        background: none;
        margin: 0;
        padding: 0;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .controls { display: none !important; }

      .sheet {
        box-shadow: none;
        margin: 0;
        page-break-after: always;
        break-inside: avoid;
      }

      .sheet:last-child { page-break-after: auto; }
    }

    @media screen and (max-width: 980px) {
      .controls { align-items: stretch; }
      .control-stack { flex-direction: column; align-items: stretch; }
      .input-group { justify-content: space-between; }
      #unitSelect,
      #worksheetSelect { min-width: 0; width: 100%; }
    }

    @media screen and (max-width: 850px) {
      .sheet {
        transform: scale(0.55);
        transform-origin: top center;
        margin-bottom: -500px;
      }

      .sheet:last-child { margin-bottom: 0; }
    }
  </style>
</head>
<body>

<div class="controls">
  <div class="control-stack">
    <div class="input-group">
      <label for="unitSelect">단원</label>
      <select id="unitSelect"></select>
    </div>

    <div class="input-group">
      <label for="worksheetSelect">연습지</label>
      <select id="worksheetSelect"></select>
    </div>
  </div>

  <div class="input-group">
    <label for="pageCount">쪽수</label>
    <input type="number" id="pageCount" value="1" min="1" max="20">
  </div>

  <div class="input-group">
    <label for="problemCount">문제 수</label>
    <input type="number" id="problemCount" value="" min="1" max="40" placeholder="기본">
  </div>

  <div class="input-group">
    <label for="fontScale">글자 크기</label>
    <select id="fontScale">
      <option value="0.8">작게</option>
      <option value="1" selected>보통</option>
      <option value="1.2">크게</option>
      <option value="1.5">아주 크게</option>
    </select>
  </div>

  <button class="btn-refresh" onclick="generate('replace')">
    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
    새로 만들기
  </button>

  <button class="btn-add" onclick="generate('append')">
    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
    이어 붙이기
  </button>

  <button class="btn-answer" onclick="toggleAnswers()">
    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
    정답 보기
  </button>

  <button class="btn-print" onclick="window.print()">
    <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M7 17H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2M7 9h10V4H7v5zm10 8H7v5h10v-5z"/></svg>
    인쇄
  </button>

  <div class="meta-note">
    <span class="meta-chip" id="selectedSection"></span>
    <span class="meta-chip" id="selectedLesson"></span>
  </div>
</div>

<div id="sheets-container"></div>

<script>
'use strict';

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randChoice(items) { return items[rand(0, items.length - 1)]; }
function gcd(a, b) { return b === 0 ? Math.abs(a) : gcd(b, a % b); }
function lcm(a, b) { return Math.abs(a * b) / gcd(a, b); }
function simplify(n, d) {
  const g = gcd(Math.abs(n), Math.abs(d));
  return [n / g, d / g];
}

function escapeAttr(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function factorsOf(n) {
  const result = [];
  for (let i = 1; i <= n; i++) {
    if (n % i === 0) result.push(i);
  }
  return result;
}

function multiplesOf(n, count) {
  return Array.from({ length: count }, (_, idx) => n * (idx + 1));
}

function fracD(n, d) {
  return `<span class="frac-d"><span class="ft">${n}</span><span class="fb">${d}</span></span>`;
}

function mixedD(w, n, d) {
  return `<span class="mixed-d"><span class="whole">${w}</span>${fracD(n, d)}</span>`;
}

function numBlank(value, unit = '') {
  return `<span class="num-blank" data-ans="${escapeAttr(value)}">${value}</span>${unit ? `<span class="unit-tail">${unit}</span>` : ''}`;
}

function textBlank(value, minWidth = 72) {
  return `<span class="text-blank" style="min-width:${minWidth}px" data-ans="${escapeAttr(value)}">${value}</span>`;
}

function symBlank(value) {
  return `<span class="sym-blank" data-ans="${escapeAttr(value)}">${value}</span>`;
}

function multiBlank(values) {
  return values.map(v => numBlank(v)).join(' ');
}

function fracBlank(n, d) {
  return `<span class="frac-blank">
    <span class="fb-top" data-ans="${escapeAttr(n)}">${n}</span>
    <span class="fb-line"></span>
    <span class="fb-bot" data-ans="${escapeAttr(d)}">${d}</span>
  </span>`;
}

function mixedBlank(w, n, d) {
  return `<span class="mixed-d"><span class="num-blank" data-ans="${escapeAttr(w)}">${w}</span>${fracBlank(n, d)}</span>`;
}

function relationTableHtml(xLabel, yLabel, xs, ys) {
  const headCells = xs.map((value) => `<td>${value}</td>`).join('');
  const bodyCells = ys.map((value) => `<td>${value}</td>`).join('');
  return `<table class="relation-table">
    <tbody>
      <tr><th>${xLabel}</th>${headCells}</tr>
      <tr><th>${yLabel}</th>${bodyCells}</tr>
    </tbody>
  </table>`;
}

function svgShell(inner) {
  return `<svg class="shape-svg" viewBox="0 0 160 104" aria-hidden="true">${inner}</svg>`;
}

function unitGridSvg(cols, rows) {
  const cell = 20;
  const width = cols * cell;
  const height = rows * cell;
  const startX = 18;
  const startY = 18;
  const rects = [];

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      rects.push(`<rect class="grid-fill" x="${startX + (x * cell)}" y="${startY + (y * cell)}" width="${cell}" height="${cell}"></rect>`);
    }
  }

  for (let x = 0; x <= cols; x++) {
    rects.push(`<line class="grid-line" x1="${startX + (x * cell)}" y1="${startY}" x2="${startX + (x * cell)}" y2="${startY + height}"></line>`);
  }

  for (let y = 0; y <= rows; y++) {
    rects.push(`<line class="grid-line" x1="${startX}" y1="${startY + (y * cell)}" x2="${startX + width}" y2="${startY + (y * cell)}"></line>`);
  }

  rects.push(`<text x="${startX + width + 8}" y="${startY + 15}">한 칸 = 1㎠</text>`);
  return svgShell(rects.join(''));
}

function formulaResultHtml(num, den) {
  const [sn, sd] = simplify(num, den);
  if (sd === 1) return numBlank(sn);
  if (sn > sd) {
    const whole = Math.floor(sn / sd);
    const remain = sn % sd;
    if (remain === 0) return numBlank(whole);
    return mixedBlank(whole, remain, sd);
  }
  return fracBlank(sn, sd);
}

function divMethodSteps(a, b) {
  const steps = [];
  let x = a, y = b;
  for (let d = 2; d <= Math.min(x, y); ) {
    if (x % d === 0 && y % d === 0) {
      steps.push({ divisor: d, vals: [x, y] });
      x = x / d;
      y = y / d;
    } else {
      d++;
    }
  }
  steps.push({ divisor: null, vals: [x, y] });
  return steps;
}

function buildDivMethodHtml(a, b, mode) {
  const steps = divMethodSteps(a, b);
  const divisors = steps.filter(s => s.divisor !== null).map(s => s.divisor);
  const lastVals = steps[steps.length - 1].vals;
  const gcdVal = divisors.reduce((acc, d) => acc * d, 1);

  let rowsHtml = '';
  for (let i = 0; i < steps.length; i++) {
    const s = steps[i];
    if (s.divisor !== null) {
      rowsHtml += `<div class="div-method-row">
        <span class="div-method-divisor">${numBlank(s.divisor)}</span>
        <span class="div-method-paren">)</span>
        <span class="div-method-values">${s.vals.map(v => `<span data-ans="${v}">${v}</span>`).join('')}</span>
      </div>`;
    } else {
      rowsHtml += `<div class="div-method-row">
        <span class="div-method-divisor"></span>
        <span class="div-method-paren" style="visibility:hidden">)</span>
        <span class="div-method-values">${s.vals.map(v => `<span data-ans="${v}">${v}</span>`).join('')}</span>
      </div>`;
    }
  }

  const divisorStr = divisors.map(String).join(' × ');
  let resultHtml = '';
  if (mode === 'gcd') {
    resultHtml = `<div class="div-method-result">
      <span class="div-method-result-label">최대공약수는 ${numBlank(divisorStr + ' = ' + gcdVal)}</span>
    </div>`;
    if (gcd(lastVals[0], lastVals[1]) === 1) {
      resultHtml += `<div class="div-method-note"><span class="div-method-coprime">${lastVals[0]}와 ${lastVals[1]}는 서로소이다.</span></div>`;
    }
  } else {
    const lcmVal = gcdVal * lastVals[0] * lastVals[1];
    const allFactors = [...divisors, ...lastVals];
    const lcmStr = allFactors.map(String).join(' × ');
    resultHtml = `<div class="div-method-result">
      <span class="div-method-result-label">최소공배수는 ${numBlank(lcmStr + ' = ' + lcmVal)}</span>
    </div>`;
  }

  return `<div class="div-method">
    <div class="div-method-title">${a}과 ${b}의 ${mode === 'gcd' ? '최대공약수' : '최소공배수'} 구하기</div>
    ${rowsHtml}
    ${resultHtml}
  </div>`;
}

function decToFrac(dec) {
  const str = String(dec);
  const dotIdx = str.indexOf('.');
  if (dotIdx === -1) return { n: Number(dec), d: 1 };
  const decimals = str.length - dotIdx - 1;
  const d = Math.pow(10, decimals);
  const n = Math.round(dec * d);
  const g = gcd(n, d);
  return { n: n / g, d: d / g };
}

function genU4MainDecCmp() {
  const set = randChoice([
    { n: 1, d: 2, dec: '0.6' },
    { n: 3, d: 4, dec: '0.7' },
    { n: 2, d: 5, dec: '0.5' },
    { n: 7, d: 10, dec: '0.6' },
    { n: 1, d: 4, dec: '0.3' },
    { n: 3, d: 5, dec: '0.8' },
    { n: 1, d: 5, dec: '0.3' },
    { n: 3, d: 10, dec: '0.4' },
    { n: 4, d: 5, dec: '0.7' },
    { n: 9, d: 10, dec: '0.8' },
  ]);
  const answer = (set.n / set.d) > parseFloat(set.dec) ? '>' : '<';
  const decFrac = decToFrac(parseFloat(set.dec));
  const common = lcm(set.d, decFrac.d);
  const m1 = common / set.d;
  const m2 = common / decFrac.d;
  const cn1 = set.n * m1;
  const cn2 = decFrac.n * m2;
  const needExtraLcd = set.d !== common || decFrac.d !== common;

  let processHtml = '';
  processHtml += `<div class="lcd-process-row"><span class="lcd-label">소수→분수</span> ${set.dec} <span class="eq-txt">=</span> ${fracBlank(decFrac.n, decFrac.d)}</div>`;

  if (needExtraLcd && decFrac.d !== set.d) {
    processHtml += `<div class="lcd-process-row"><span class="lcd-label">통분</span> ${fracD(set.n, set.d)} <span class="eq-txt">=</span> ${fracBlank(cn1, common)} <span class="op-txt">,</span> ${fracD(decFrac.n, decFrac.d)} <span class="eq-txt">=</span> ${fracBlank(cn2, common)}</div>`;
  }

  return htmlProblem('concept-layout', `
    <div class="concept-card">
      <div class="concept-answer">${fracD(set.n, set.d)} ${symBlank(answer)} <span style="color:#2f3640;">${set.dec}</span></div>
      ${processHtml}
    </div>
  `);
}

/* ── U5 inline step-by-step expansion helpers ── */

function fracExpand(n, d, m) {
  return fracD(`${n} × ${numBlank(m)}`, `${d} × ${numBlank(m)}`);
}

function inlineFracAdd(n1, d1, n2, d2) {
  const common = lcm(d1, d2);
  const m1 = common / d1;
  const m2 = common / d2;
  const cn1 = n1 * m1;
  const cn2 = n2 * m2;
  const total = cn1 + cn2;
  let steps = `${fracD(n1, d1)} <span class="op-txt">+</span> ${fracD(n2, d2)}`;
  if (m1 !== 1 || m2 !== 1) {
    steps += ` <span class="eq-txt">=</span> ${fracExpand(n1, d1, m1)} <span class="op-txt">+</span> ${fracExpand(n2, d2, m2)}`;
    steps += ` <span class="eq-txt">=</span> ${fracD(numBlank(cn1), common)} <span class="op-txt">+</span> ${fracD(numBlank(cn2), common)}`;
  }
  steps += ` <span class="eq-txt">=</span> ${formulaResultHtml(total, common)}`;
  return steps;
}

function inlineFracSub(n1, d1, n2, d2) {
  const common = lcm(d1, d2);
  const m1 = common / d1;
  const m2 = common / d2;
  const cn1 = n1 * m1;
  const cn2 = n2 * m2;
  const diff = cn1 - cn2;
  let steps = `${fracD(n1, d1)} <span class="op-txt">−</span> ${fracD(n2, d2)}`;
  if (m1 !== 1 || m2 !== 1) {
    steps += ` <span class="eq-txt">=</span> ${fracExpand(n1, d1, m1)} <span class="op-txt">−</span> ${fracExpand(n2, d2, m2)}`;
    steps += ` <span class="eq-txt">=</span> ${fracD(numBlank(cn1), common)} <span class="op-txt">−</span> ${fracD(numBlank(cn2), common)}`;
  }
  steps += ` <span class="eq-txt">=</span> ${formulaResultHtml(diff, common)}`;
  return steps;
}

function inlineMixedAddImproper(w1, n1, d1, w2, n2, d2) {
  const imp1 = w1 * d1 + n1;
  const imp2 = w2 * d2 + n2;
  const common = lcm(d1, d2);
  const m1 = common / d1;
  const m2 = common / d2;
  const cn1 = imp1 * m1;
  const cn2 = imp2 * m2;
  const total = cn1 + cn2;
  let steps = `${mixedD(w1, n1, d1)} <span class="op-txt">+</span> ${mixedD(w2, n2, d2)}`;
  steps += ` <span class="eq-txt">=</span> ${fracD(numBlank(imp1), d1)} <span class="op-txt">+</span> ${fracD(numBlank(imp2), d2)}`;
  if (m1 !== 1 || m2 !== 1) {
    steps += ` <span class="eq-txt">=</span> ${fracD(numBlank(cn1), common)} <span class="op-txt">+</span> ${fracD(numBlank(cn2), common)}`;
  }
  steps += ` <span class="eq-txt">=</span> ${formulaResultHtml(total, common)}`;
  return steps;
}

function inlineMixedAddSeparate(w1, n1, d1, w2, n2, d2) {
  const common = lcm(d1, d2);
  const m1 = common / d1;
  const m2 = common / d2;
  const cn1 = n1 * m1;
  const cn2 = n2 * m2;
  const fracSum = cn1 + cn2;
  const wholeSum = w1 + w2;

  const line1 = `${mixedD(w1, n1, d1)} <span class="op-txt">+</span> ${mixedD(w2, n2, d2)} <span class="eq-txt">=</span> (${numBlank(w1)} + ${numBlank(w2)})`;
  const line2 = `<span class="op-txt">+</span> (${fracExpand(n1, d1, m1)} <span class="op-txt">+</span> ${fracExpand(n2, d2, m2)})`;

  let line3 = `<span class="eq-txt">=</span> ${numBlank(wholeSum)} + ${fracD(numBlank(fracSum), common)}`;
  if (fracSum >= common) {
    const extraWhole = Math.floor(fracSum / common);
    const remain = fracSum % common;
    const finalWhole = wholeSum + extraWhole;
    if (remain === 0) {
      line3 += ` <span class="eq-txt">=</span> ${numBlank(finalWhole)}`;
    } else {
      const [sn, sd] = simplify(remain, common);
      line3 += ` <span class="eq-txt">=</span> ${mixedBlank(finalWhole, sn, sd)}`;
    }
  } else {
    const [sn, sd] = simplify(fracSum, common);
    line3 += ` <span class="eq-txt">=</span> ${mixedBlank(wholeSum, sn, sd)}`;
  }
  return { line1, line2, line3 };
}

function inlineMixedSubImproper(w1, n1, d1, w2, n2, d2) {
  const imp1 = w1 * d1 + n1;
  const imp2 = w2 * d2 + n2;
  const common = lcm(d1, d2);
  const m1 = common / d1;
  const m2 = common / d2;
  const cn1 = imp1 * m1;
  const cn2 = imp2 * m2;
  const diff = cn1 - cn2;
  let steps = `${mixedD(w1, n1, d1)} <span class="op-txt">−</span> ${mixedD(w2, n2, d2)}`;
  steps += ` <span class="eq-txt">=</span> ${fracD(numBlank(imp1), d1)} <span class="op-txt">−</span> ${fracD(numBlank(imp2), d2)}`;
  if (m1 !== 1 || m2 !== 1) {
    steps += ` <span class="eq-txt">=</span> ${fracD(numBlank(cn1), common)} <span class="op-txt">−</span> ${fracD(numBlank(cn2), common)}`;
  }
  steps += ` <span class="eq-txt">=</span> ${formulaResultHtml(diff, common)}`;
  return steps;
}

function inlineMixedSubSeparate(w1, n1, d1, w2, n2, d2) {
  const common = lcm(d1, d2);
  const m1 = common / d1;
  const m2 = common / d2;
  const cn1 = n1 * m1;
  const cn2 = n2 * m2;

  let line1, line2, line3;

  if (cn1 >= cn2) {
    const fracDiff = cn1 - cn2;
    const wholeDiff = w1 - w2;
    line1 = `${mixedD(w1, n1, d1)} <span class="op-txt">−</span> ${mixedD(w2, n2, d2)} <span class="eq-txt">=</span> (${numBlank(w1)} − ${numBlank(w2)})`;
    line2 = `<span class="op-txt">+</span> (${fracExpand(n1, d1, m1)} <span class="op-txt">−</span> ${fracExpand(n2, d2, m2)})`;
    line3 = `<span class="eq-txt">=</span> ${numBlank(wholeDiff)} + ${fracD(numBlank(fracDiff), common)}`;
    if (fracDiff === 0) {
      line3 += ` <span class="eq-txt">=</span> ${numBlank(wholeDiff)}`;
    } else {
      const [sn, sd] = simplify(fracDiff, common);
      if (wholeDiff === 0) {
        line3 += ` <span class="eq-txt">=</span> ${fracBlank(sn, sd)}`;
      } else {
        line3 += ` <span class="eq-txt">=</span> ${mixedBlank(wholeDiff, sn, sd)}`;
      }
    }
  } else {
    const borrowedN1 = cn1 + common;
    const fracDiff = borrowedN1 - cn2;
    const wholeDiff = w1 - w2 - 1;
    line1 = `${mixedD(w1, n1, d1)} <span class="op-txt">−</span> ${mixedD(w2, n2, d2)} <span class="eq-txt">=</span> (${numBlank(w1 - 1)} − ${numBlank(w2)})`;
    line2 = `<span class="op-txt">+</span> (${fracD(numBlank(borrowedN1), common)} <span class="op-txt">−</span> ${fracD(numBlank(cn2), common)})`;
    line3 = `<span class="eq-txt">=</span> ${numBlank(wholeDiff)} + ${fracD(numBlank(fracDiff), common)}`;
    if (fracDiff === 0) {
      line3 += ` <span class="eq-txt">=</span> ${numBlank(wholeDiff)}`;
    } else {
      const [sn, sd] = simplify(fracDiff, common);
      if (wholeDiff === 0) {
        line3 += ` <span class="eq-txt">=</span> ${fracBlank(sn, sd)}`;
      } else {
        line3 += ` <span class="eq-txt">=</span> ${mixedBlank(wholeDiff, sn, sd)}`;
      }
    }
  }
  return { line1, line2, line3 };
}

function genU5MainAdd() {
  let d1, d2, n1, n2, total, common;
  do {
    d1 = rand(2, 8);
    d2 = rand(2, 8);
    n1 = rand(1, d1 - 1);
    n2 = rand(1, d2 - 1);
    common = lcm(d1, d2);
    total = (n1 * (common / d1)) + (n2 * (common / d2));
  } while (total >= common || d1 === d2);
  return fracStepProblem(inlineFracAdd(n1, d1, n2, d2));
}

function genU5MainMixedAddImproper() {
  let d1, d2;
  do {
    d1 = rand(2, 5);
    d2 = rand(2, 5);
  } while (d1 === d2);
  const w1 = rand(1, 3);
  const w2 = rand(1, 3);

const catalogMap = Object.fromEntries(WORKSHEET_CATALOG.map((item) => [item.id, item]));

function getWorksheetsByUnit(unitId) {
  return WORKSHEET_CATALOG.filter((item) => item.unit === unitId);
}

function buildSheetTitle(item) {
  const meta = UNIT_META[item.unit];
  return {
    main: `${meta.short} [${item.section}] ${item.label}`,
    sub: item.lessonRef,
  };
}

const PDF_GENERATORS = {
  add_2d() {
    const a = rand(11, 89);
    const b = rand(11, 99 - a);
    return { num1: a, num2: b, op: '+', ans: a + b };
  },
  add_3d() {
    const a = rand(100, 499);
    const b = rand(100, 400);
    return { num1: a, num2: b, op: '+', ans: a + b };
  },
  sub_2d() {
    const b = rand(11, 49);
    const a = b + rand(10, 50);
    return { num1: a, num2: b, op: '−', ans: a - b };
  },
  sub_3d() {
    const b = rand(100, 399);
    const a = b + rand(10, 300);
    return { num1: a, num2: b, op: '−', ans: a - b };
  },
  mul_2d1d() {
    const a = rand(12, 99);
    const b = rand(2, 9);
    return { num1: a, num2: b, op: '×', ans: a * b };
  },
  mul_2d2d() {
    const a = rand(12, 45);
    const b = rand(11, 25);
    return { num1: a, num2: b, op: '×', ans: a * b };
  },
  mul_3d2d() {
    const a = rand(100, 399);
    const b = rand(11, 25);
    return { num1: a, num2: b, op: '×', ans: a * b };
  },
  div_2d1d() {
    const dvsr = rand(2, 9);
    const dvnd = rand(10, 99);
    return { dvsr, dvnd, quot: Math.floor(dvnd / dvsr), rem: dvnd % dvsr };
  },
  div_2d1d_norem() {
    const dvsr = rand(2, 9);
    const q = rand(3, Math.floor(99 / dvsr));
    const dvnd = dvsr * q;
    return { dvsr, dvnd, quot: q, rem: 0 };
  },
  div_2d1d_rem() {
    const dvsr = rand(2, 9);
    const q = rand(3, Math.floor((99 - dvsr + 1) / dvsr));
    const r = rand(1, dvsr - 1);
    const dvnd = dvsr * q + r;
    if (dvnd > 99) return PDF_GENERATORS.div_2d1d_rem();
    return { dvsr, dvnd, quot: q, rem: r };
  },
  div_3d1d() {
    const dvsr = rand(2, 9);
    const dvnd = rand(100, 999);
    return { dvsr, dvnd, quot: Math.floor(dvnd / dvsr), rem: dvnd % dvsr };
  },
  div_3d2d() {
    const dvsr = rand(11, 30);
    const dvnd = rand(100, 999);
    const quot = Math.floor(dvnd / dvsr);
    if (quot < 10) return PDF_GENERATORS.div_3d2d();
    return { dvsr, dvnd, quot, rem: dvnd % dvsr };
  },
};

  div_3d2d: { type: 'div',    minCols: 2, maxCols: 3, maxRows: 3, targetCellAspect: 0.78, minCellWidth: 42, minCellHeight: 58, baseGap: [10, 8] },
};

const GRID_LAYOUTS = {
  standard: { minCols: 2, maxCols: 4, maxRows: 5, targetCellAspect: 1.45, minCellWidth: 48, minCellHeight: 26, widthPriority: 1.2, baseGap: [12, 8] },
  practice: { minCols: 2, maxCols: 3, maxRows: 5, targetCellAspect: 1.32, minCellWidth: 52, minCellHeight: 28, widthPriority: 1.25, baseGap: [12, 8] },
  dense:    { minCols: 2, maxCols: 4, maxRows: 9, targetCellAspect: 1.12, minCellWidth: 36, minCellHeight: 16, widthPriority: 0.8, baseGap: [6, 5] },
  divgrid:  { minCols: 2, maxCols: 3, maxRows: 4, targetCellAspect: 1.0,  minCellWidth: 50, minCellHeight: 30, widthPriority: 1.0, baseGap: [12, 8] },
  concept:  { minCols: 1, maxCols: 2, maxRows: 5, targetCellAspect: 1.05, minCellWidth: 72, minCellHeight: 44, widthPriority: 0.9, baseGap: [14, 14] },
  wide:     { minCols: 1, maxCols: 2, maxRows: 4, targetCellAspect: 1.08, minCellWidth: 78, minCellHeight: 66, widthPriority: 0.8, baseGap: [16, 16] },
};

const THREE_PLUS_HORIZONTAL_IDS = new Set([
  'u1_main_addsub',
  'u1_main_muldiv',
  'u1_main_addsubmul',
  'u1_main_addsubdiv',
  'u1_main_mix',
]);

const TWO_COLUMN_WORKSHEET_IDS = new Set([
  'u4_main_red_process',
  'u4_main_lcd_process',
]);

function isPdfWorksheet(item) {
  return Boolean(PDF_WORKSHEET_MAP[item.id]);
}

function getPdfOpType(item) {
  return PDF_WORKSHEET_MAP[item.id];
}

function getPdfLimit(item) {
  const cfg = PDF_LAYOUTS[getPdfOpType(item)];
  return cfg.maxCols * cfg.maxRows;
}

function getHtmlLimit(item) {
  const cfg = getHtmlLayoutConfig(item);
  return cfg ? cfg.maxCols * cfg.maxRows : 40;
}

function getWorksheetLimit(item) {
  return isPdfWorksheet(item) ? getPdfLimit(item) : getHtmlLimit(item);
}

function getHtmlLayoutConfig(item) {
  const base = GRID_LAYOUTS[item.grid];
  if (!base) return null;

  if (TWO_COLUMN_WORKSHEET_IDS.has(item.id)) {
    return {
      ...base,
      minCols: 2,
      maxCols: 2,
      widthPriority: 1.5,
      minCellWidth: Math.max(base.minCellWidth || 0, 76),
    };
  }

  if (!THREE_PLUS_HORIZONTAL_IDS.has(item.id)) return base;
  return {
    ...base,
    minCols: 2,
    maxCols: 2,
    widthPriority: 2,
    minCellWidth: Math.max(base.minCellWidth || 0, 78),
  };
}

function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function resolveGridLayout(config, count, fontScale = 1) {
  const safeCount = Math.max(1, count);
  const scale = Math.max(0.8, Number(fontScale) || 1);
  const maxCols = Math.min(config.maxCols, safeCount);
  const minCols = Math.min(config.minCols || 1, maxCols);
  const usableWidth = config.usableWidth || SHEET_GRID_BOUNDS.width;
  const usableHeight = config.usableHeight || SHEET_GRID_BOUNDS.height;
  const requiredWidth = (config.minCellWidth || 40) * scale;
  const requiredHeight = (config.minCellHeight || 28) * Math.min(scale, 1.2);
  let best = null;

  for (let cols = minCols; cols <= maxCols; cols++) {
    const rows = Math.ceil(safeCount / cols);
    if (rows > config.maxRows) continue;

    const cells = cols * rows;
    const emptyRatio = (cells - safeCount) / cells;
    const fullness = safeCount / (config.maxCols * config.maxRows);
    const cellWidth = usableWidth / cols;
    const cellHeight = usableHeight / rows;
    const cellAspect = cellWidth / cellHeight;
    const widthFit = cellWidth / requiredWidth;
    const heightFit = cellHeight / requiredHeight;
    const preferredCols = clamp(
      Math.round(config.maxCols * Math.pow(fullness, 0.35) - ((scale - 1) * (config.widthPriority || 0))),
      minCols,
      maxCols
    );
    let score = 100;

    score -= Math.abs(cellAspect - (config.targetCellAspect || 1)) * 18;
    score -= emptyRatio * 18;
    score -= Math.abs(cols - preferredCols) * 4 * (1 - fullness);
    score -= (rows / config.maxRows) * 6;
    if (widthFit < 1) score -= (1 - widthFit) * 140;
    else score += Math.min(widthFit - 1, 0.45) * 12;
    if (heightFit < 1) score -= (1 - heightFit) * 110;
    else score += Math.min(heightFit - 1, 0.5) * 8;

    if (rows === 1 && safeCount > 2) score -= 8;
    if (cols === 1 && (config.minCols || 1) > 1) score -= 12;

    if (!best || score > best.score) {
      best = { cols, rows, score, widthFit, heightFit };
    }
  }

  if (!best) {
    best = {
      cols: maxCols,
      rows: Math.min(config.maxRows, Math.ceil(safeCount / maxCols)),
      score: 0,
    };
  }

  const density = safeCount <= Math.max(4, best.cols * 2)
    ? 'spacious'
    : (safeCount >= Math.max(best.cols * (config.maxRows - 1), config.maxCols * config.maxRows * 0.75) ? 'dense' : 'regular');
  const gapFactor = density === 'spacious' ? 1.15 : (density === 'dense' ? 0.9 : 1);
  const [baseRowGap, baseColGap] = config.baseGap || [12, 8];

  return {
    cols: best.cols,
    rows: best.rows,
    density,
    rowGap: Math.round(baseRowGap * gapFactor),
    colGap: Math.round(baseColGap * gapFactor),
  };
}

function applyGridLayout(grid, layout) {
  grid.style.gridTemplateColumns = `repeat(${layout.cols}, minmax(0, 1fr))`;
  grid.style.gridTemplateRows = `repeat(${layout.rows}, minmax(0, 1fr))`;
  grid.style.rowGap = `${layout.rowGap}px`;
  grid.style.columnGap = `${layout.colGap}px`;
  grid.dataset.layoutMode = layout.density;
}

function pdfDigits(num, cols) {
  const digits = String(Math.abs(num)).split('').map(Number);
  while (digits.length < cols) digits.unshift(null);
  return digits;
}

function pdfCell(digit) {
  return digit !== null ? digit : '';
}

function renderPdfAddSub(problem, idx) {
  const cols = Math.max(
    String(problem.num1).length,
    String(problem.num2).length,
    String(Math.abs(problem.ans)).length
  );
  const d1 = pdfDigits(problem.num1, cols);
  const d2 = pdfDigits(problem.num2, cols);
  const da = pdfDigits(problem.ans, cols);

  let rows = '';
  rows += '<tr>' + '<td></td>' + d1.map((digit) => `<td>${pdfCell(digit)}</td>`).join('') + '</tr>';
  rows += '<tr>' + `<td class="pdf-op-cell pdf-sep-bottom">${problem.op}</td>` + d2.map((digit) => `<td class="pdf-sep-bottom">${pdfCell(digit)}</td>`).join('') + '</tr>';
  rows += '<tr>' + '<td></td>' + da.map((digit) => `<td class="ans-digit">${pdfCell(digit)}</td>`).join('') + '</tr>';

  return `<div class="problem-item"><div class="problem-num">${idx}</div><table class="pdf-grid-table">${rows}</table></div>`;
}

function renderPdfMulShort(problem, idx) {
  const cols = Math.max(
    String(problem.num1).length,
    String(problem.num2).length,
    String(problem.ans).length
  );
  const d1 = pdfDigits(problem.num1, cols);
  const d2 = pdfDigits(problem.num2, cols);
  const da = pdfDigits(problem.ans, cols);

  let rows = '';
  rows += '<tr>' + '<td></td>' + d1.map((digit) => `<td>${pdfCell(digit)}</td>`).join('') + '</tr>';
  rows += '<tr>' + '<td class="pdf-op-cell pdf-sep-bottom">×</td>' + d2.map((digit) => `<td class="pdf-sep-bottom">${pdfCell(digit)}</td>`).join('') + '</tr>';
  rows += '<tr>' + '<td></td>' + da.map((digit) => `<td class="ans-digit">${pdfCell(digit)}</td>`).join('') + '</tr>';

  return `<div class="problem-item"><div class="problem-num">${idx}</div><table class="pdf-grid-table">${rows}</table></div>`;
}

function renderPdfMulLong(problem, idx) {
  const ones = problem.num2 % 10;
  const tens = Math.floor(problem.num2 / 10);
  const partial1 = problem.num1 * ones;
  const partial2 = problem.num1 * tens;
  const cols = Math.max(
    String(problem.num1).length,
    String(problem.num2).length,
    String(partial1).length,
    String(partial2).length + 1,
    String(problem.ans).length
  );

  const d1 = pdfDigits(problem.num1, cols);
  const d2 = pdfDigits(problem.num2, cols);
  const dp1 = pdfDigits(partial1, cols);
  const dp2 = [];
  const p2Digits = String(partial2).split('').map(Number);
  while (dp2.length + p2Digits.length + 1 < cols) dp2.push(null);
  dp2.push(...p2Digits);
  dp2.push(null);
  const da = pdfDigits(problem.ans, cols);

  let rows = '';
  rows += '<tr>' + '<td></td>' + d1.map((digit) => `<td>${pdfCell(digit)}</td>`).join('') + '</tr>';
  rows += '<tr>' + '<td class="pdf-op-cell pdf-sep-bottom">×</td>' + d2.map((digit) => `<td class="pdf-sep-bottom">${pdfCell(digit)}</td>`).join('') + '</tr>';
  rows += '<tr>' + '<td></td>' + dp1.map((digit) => `<td class="ans-digit">${pdfCell(digit)}</td>`).join('') + '</tr>';
  rows += '<tr>' + '<td class="pdf-sep-bottom"></td>' + dp2.map((digit) => `<td class="ans-digit pdf-sep-bottom">${pdfCell(digit)}</td>`).join('') + '</tr>';
  rows += '<tr>' + '<td></td>' + da.map((digit) => `<td class="ans-digit">${pdfCell(digit)}</td>`).join('') + '</tr>';

  return `<div class="problem-item"><div class="problem-num">${idx}</div><table class="pdf-grid-table">${rows}</table></div>`;
}

function simulatePdfDivision(dvsr, dvnd) {
  const digits = String(dvnd);
  const steps = [];
  let current = 0;
  let started = false;

  for (let i = 0; i < digits.length; i++) {
    current = (current * 10) + parseInt(digits[i], 10);
    const quotientDigit = Math.floor(current / dvsr);
    if (quotientDigit > 0 || started) {
      started = true;
      const sub = quotientDigit * dvsr;
      steps.push({ sub, rem: current - sub });
      current -= sub;
    }
  }

  return steps;
}

function renderPdfDiv(problem, idx) {
  const divisorCols = String(problem.dvsr).length;
  const workCols = String(problem.dvnd).length;
  const quotientDigits = pdfDigits(problem.quot, workCols);
  const divisorDigits = pdfDigits(problem.dvsr, divisorCols);
  const dividendDigits = pdfDigits(problem.dvnd, workCols);
  const steps = simulatePdfDivision(problem.dvsr, problem.dvnd);
  const workRowCount = Math.max(steps.length, 1);

  let html = '<tr>';
  for (let c = 0; c < divisorCols; c++) html += '<td></td>';
  for (let c = 0; c < workCols; c++) html += `<td class="pdf-b pdf-quot-border ans-digit">${pdfCell(quotientDigits[c])}</td>`;
  html += '</tr>';

  html += '<tr>';
  for (let c = 0; c < divisorCols; c++) {
    const cls = c === divisorCols - 1 ? 'pdf-dvsr-border' : '';
    html += `<td class="${cls}">${pdfCell(divisorDigits[c])}</td>`;
  }
  for (let c = 0; c < workCols; c++) html += `<td class="pdf-b">${pdfCell(dividendDigits[c])}</td>`;
  html += '</tr>';

  for (let row = 0; row < workRowCount; row++) {
    html += '<tr>';
    for (let c = 0; c < divisorCols; c++) html += '<td></td>';
    for (let c = 0; c < workCols; c++) html += '<td class="pdf-b"></td>';
    html += '</tr>';

    html += '<tr>';
    for (let c = 0; c < divisorCols; c++) html += '<td></td>';
    for (let c = 0; c < workCols; c++) html += '<td class="pdf-b" style="border-top:2.5px solid #2f3640;"></td>';
    html += '</tr>';
  }

  html += '<tr>';
  for (let c = 0; c < divisorCols; c++) html += '<td></td>';
  for (let c = 0; c < workCols; c++) html += '<td class="pdf-b"></td>';
  html += '</tr>';

  return `<div class="problem-item"><div class="problem-num">${idx}</div><table class="pdf-div-table">${html}</table></div>`;
}

function renderPdfProblem(opType, problem, idx) {
  const type = PDF_LAYOUTS[opType].type;
  if (type === 'addsub') return renderPdfAddSub(problem, idx);
  if (type === 'mul_s') return renderPdfMulShort(problem, idx);
  if (type === 'mul_l') return renderPdfMulLong(problem, idx);
  return renderPdfDiv(problem, idx);
}

function renderItem(problem, idx) {
  const num = `<div class="problem-num">${idx}</div>`;

  if (problem.kind === 'vertical') {
    return `<div class="problem-item">${num}
      <div class="calc-wrapper"><div class="calc-box">
        <div class="row">${problem.num1}</div>
        <div class="operator-row"><span>${problem.op}</span><span>${problem.num2}</span></div>
        <div class="calc-ans">${problem.ans}</div>
      </div></div>
    </div>`;
  }

  if (problem.kind === 'longdiv') {
    const remStr = problem.rem > 0 ? ` … ${problem.rem}` : '';
    return `<div class="problem-item">${num}
      <table class="ldiv-table">
        <tr>
          <td></td>
          <td><div class="ldiv-q-box"><span data-ans="${problem.quot}${remStr}">${problem.quot}${remStr}</span></div></td>
        </tr>
        <tr>
          <td class="ldiv-dvsr-td">${problem.dvsr}</td>
          <td class="ldiv-dvnd-td">${problem.dvnd}</td>
        </tr>
      </table>
    </div>`;
  }

  const layoutClass = problem.layout || 'horiz-box';
  const itemClass = problem.itemClass ? ` ${problem.itemClass}` : '';
  return `<div class="problem-item${itemClass}">${num}<div class="${layoutClass}">${problem.html}</div></div>`;
}

function createSheet(item, countOverride, fontScale = 1) {
  if (isPdfWorksheet(item)) {
    const opType = getPdfOpType(item);
    const cfg = PDF_LAYOUTS[opType];
    const count = countOverride || item.count;
    const layout = resolveGridLayout(cfg, count, fontScale);
    const sheet = document.createElement('div');
    sheet.className = 'sheet';

    const titleWrap = document.createElement('div');
    titleWrap.className = 'sheet-title';

    const title = buildSheetTitle(item);
    const main = document.createElement('div');
    main.className = 'sheet-title-main';
    main.textContent = title.main;
    const sub = document.createElement('div');
    sub.className = 'sheet-title-sub';
    sub.textContent = title.sub;
    titleWrap.appendChild(main);
    titleWrap.appendChild(sub);
    sheet.appendChild(titleWrap);

    const grid = document.createElement('div');
    grid.className = 'problem-grid';
    applyGridLayout(grid, layout);

    for (let i = 1; i <= count; i++) {
      const problem = PDF_GENERATORS[opType]();
      grid.insertAdjacentHTML('beforeend', renderPdfProblem(opType, problem, i));
    }

    sheet.appendChild(grid);
    return sheet;
  }

  const count = countOverride || item.count;
  const layoutCfg = getHtmlLayoutConfig(item) || { minCols: 1, maxCols: 4, maxRows: 10, targetCellAspect: 1, minCellWidth: 44, minCellHeight: 28, baseGap: [12, 8] };
  const layout = resolveGridLayout(layoutCfg, count, fontScale);
  const sheet = document.createElement('div');
  sheet.className = 'sheet';

  const titleWrap = document.createElement('div');
  titleWrap.className = 'sheet-title';

  const title = buildSheetTitle(item);
  const main = document.createElement('div');
  main.className = 'sheet-title-main';
  main.textContent = title.main;
  const sub = document.createElement('div');
  sub.className = 'sheet-title-sub';
  sub.textContent = title.sub;
  titleWrap.appendChild(main);
  titleWrap.appendChild(sub);
  sheet.appendChild(titleWrap);

  const grid = document.createElement('div');
  grid.className = `problem-grid ${item.grid}`;
  applyGridLayout(grid, layout);

  for (let i = 1; i <= count; i++) {
    const problem = item.generator();
    grid.insertAdjacentHTML('beforeend', renderItem(problem, i));
  }

  sheet.appendChild(grid);
  return sheet;
}

function populateUnitSelect() {
  const unitSelect = document.getElementById('unitSelect');
  unitSelect.innerHTML = Object.entries(UNIT_META)
    .map(([id, meta]) => `<option value="${id}">${meta.short}: ${meta.name}</option>`)
    .join('');
}

function populateWorksheetSelect(unitId, preferredId) {
  const worksheetSelect = document.getElementById('worksheetSelect');
  const items = getWorksheetsByUnit(unitId);
  worksheetSelect.innerHTML = items.map((item) => `<option value="${item.id}">[${item.section}] ${item.label}</option>`).join('');

  const nextId = preferredId && items.some((item) => item.id === preferredId) ? preferredId : items[0].id;
  worksheetSelect.value = nextId;
  updateSelectedMeta();
}

function updateSelectedMeta() {
  const item = catalogMap[document.getElementById('worksheetSelect').value];
  const section = document.getElementById('selectedSection');
  const lesson = document.getElementById('selectedLesson');
  const countInput = document.getElementById('problemCount');
  const limit = getWorksheetLimit(item);
  const defaultCount = Math.min(item.count, limit);
  section.textContent = `${UNIT_META[item.unit].short} · ${item.section}`;
  lesson.textContent = `교과 차시: ${item.lessonRef}`;
  countInput.placeholder = defaultCount;
  countInput.max = limit;
  if (countInput.value) {
    countInput.value = Math.min(parseInt(countInput.value, 10) || defaultCount, limit);
  }
}

let answerShown = false;

function generate(mode) {
  const container = document.getElementById('sheets-container');
  const problemCountInput = document.getElementById('problemCount');
  const worksheetId = document.getElementById('worksheetSelect').value;
  const pageCount = Math.min(20, Math.max(1, parseInt(document.getElementById('pageCount').value, 10) || 1));
  const item = catalogMap[worksheetId];

  const customCount = parseInt(problemCountInput.value, 10);
  const maxCount = getWorksheetLimit(item);
  const defaultCount = Math.min(item.count, maxCount);
  const effectiveCount = (customCount > 0) ? Math.min(maxCount, customCount) : defaultCount;

  if (customCount > maxCount) {
    problemCountInput.value = effectiveCount;
  }

  const fontScale = document.getElementById('fontScale').value;
  container.style.setProperty('--font-scale', fontScale);
  container.style.setProperty('--pdf-scale', fontScale);

  if (mode === 'replace') container.innerHTML = '';

  container.classList.remove('answers-shown');
  answerShown = false;

  for (let i = 0; i < pageCount; i++) {
    container.appendChild(createSheet(item, effectiveCount, parseFloat(fontScale)));
  }
}

function toggleAnswers() {
  answerShown = !answerShown;
  document.getElementById('sheets-container').classList.toggle('answers-shown', answerShown);
}

document.getElementById('unitSelect').addEventListener('change', (event) => {
  populateWorksheetSelect(event.target.value);
});

document.getElementById('worksheetSelect').addEventListener('change', () => {
  updateSelectedMeta();
});

document.getElementById('fontScale').addEventListener('change', () => {
  const container = document.getElementById('sheets-container');
  const scale = document.getElementById('fontScale').value;
  container.style.setProperty('--font-scale', scale);
  container.style.setProperty('--pdf-scale', scale);
});

populateUnitSelect();
populateWorksheetSelect('u1');
generate('replace');
</script>
